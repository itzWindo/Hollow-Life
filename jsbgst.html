<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" type="image/x-icon" href="favicon.svg">
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0">
        <title>...</title>
        <style>
            @font-face {
                font-family: 'Clock';
                src: url('fonts/Clock.ttf') format('truetype');
            }

            body {
                margin: 0;
                background: black;
                opacity: 0; 
                animation: fadeInPage 1.5s ease-in forwards;
            }

            #clock {
                position: relative;
                width: 100%;
            }

            #clockImage {
                display: block;
                width: 100%;
                height: auto;
                opacity: 0;
                animation: fadeInPage 1.5s ease-in forwards;
            }

            #toggleBtn {
                position: absolute;
                left: 40%;
                top: 40%;
                width: 9%;
                height: 4%;
                transform: translate(-50%, -50%);
                opacity: 0.05;
                cursor: pointer;
            }

            #travelBtn {
                position: absolute;
                left: 60%;
                top: 40%;
                width: 9%;
                height: 4%;
                transform: translate(-50%, -50%);
                opacity: 0.05;
                cursor: pointer;
            }
            
            #display {
                position: absolute;
                left: 50%;
                top: 57%;
                transform: translate(-50%, -50%);
                font-family: 'Clock';
                font-size: clamp(20px, 6vw, 90px);
                color: red;
                white-space: nowrap;
            }

            @keyframes fadeInPage {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <div id="clock">
            <img src="images/clock.png" id="clockImage">
            <div id="display">2022-03-22</div>
            <button id="toggleBtn" title="Set date" title="Set date"></button>
            <button id="travelBtn" title="Travel" title="Travel"></button>
        </div>
        <script>
            const dates = [
                "2012-03-22",
                "2019-12-14",
                "2020-10-17",
                "2022-03-22"
            ]

            const destinations = {
                "2012-03-22": "past/index.html",
                "2019-12-14": "past/jim.html",
                "2020-10-17": "past/player.html",
                "2022-03-22": "index.html"
            };
            
            let currentList = 3;
            let currentDate = dates[currentList];

            toggleBtn.onclick = () => {
                playClock();
                currentList++;
                if (currentList >= dates.length) {
                    currentList = 0
                }

                currentDate = dates[currentList];
                display.textContent = currentDate;
            };

            travelBtn.onclick = () => {
                playClock();
                document.cookie = "tmprlLk=true; path=/; max-age=1800";

                setTimeout(() => {
                    window.location.href = destinations[currentDate];
                }, 200);
            };

            const clock = new Audio("audio/clock.opus");
            clock.preload = "auto";

            function playClock() {
                clock.currentTime = 0;
                clock.play().catch(error => {
                    console.log("Audio playback failed:", error);
                });
            }
        </script>
    </body>
</html>
