<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CD Player</title>
        <link rel="stylesheet" href="player.css">
        <script src="access.js"></script>
        <script src="player.js" defer></script>
        <script src="../inventory.js" defer></script>
    </head>
    <body>
        <main class="player" id="cdPlayerDropZone" aria-label="Interactive CD player">
            <img src="cdp.jpg" alt="A portable CD player in a dark room" draggable="false">
            <svg class="hotspots" viewBox="0 0 1000 563" title="CD player controls">
                <ellipse cx="439" cy="233" rx="14" ry="10" role="button" tabindex="0" data-action="play">
                    <title>Play/Resume</title>
                </ellipse>
                <ellipse cx="464" cy="229" rx="7" ry="7" role="button" tabindex="0" data-action="stop">
                    <title>Stop</title>
                </ellipse>
                <polygon points="495,231 523,225 530,232 498,240" role="button" tabindex="0" data-action="previous">
                    <title>Previous</title>
                </polygon>
                <polygon points="528,225 558,215 564,222 532,232" role="button" tabindex="0" data-action="next">
                    <title>Next</title>
                </polygon>
            </svg>
            <div id="inventory-container">
                <h3>INVENTORY</h3>
                <div id="inventory-grid">
                    <!-- Item slots will dynamically appear here -->
                </div>
            </div>
            <style>
                #inventory-container {
                    position: fixed;
                    bottom: 20px;
                    left: 20px;
                    background: rgba(19, 17, 22, 0.85);
                    border: solid #6f09d4;
                    padding: 12px;
                    width: 220px;
                    box-shadow: 0 0 15px rgba(180, 51, 255, 0.2);
                    font-family: 'Franklin Gothic','Arial Narrow';
                    z-index: 1000;
                }

                #inventory-container h3 {
                    font-size: 0.85rem;
                    color: #d779ff;
                    text-transform: uppercase;
                    letter-spacing: 2px;
                    margin-bottom: 8px;
                    text-align: center;
                    border-bottom: 1px dashed #8c00dd;
                    padding-bottom: 4px;
                }

                #inventory-grid {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr); /* 3 items per row */
                    gap: 8px;
                    min-height: 50px;
                }

                .inv-slot {
                    width: 100%;
                    aspect-ratio: 1 / 1;
                    background-color: #0f0d11;
                    border: 1px solid #312b36;
                    border-radius: 4px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    position: relative;
                    cursor: pointer;
                }

                .inv-slot img {
                    max-width: 80%;
                    max-height: 80%;
                    object-fit: contain;
                }

                /* Optional hover tooltip for item names */
                .inv-slot:hover::after {
                    content: attr(data-item-name);
                    position: absolute;
                    bottom: 110%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #000;
                    color: #ffffff;
                    padding: 3px 6px;
                    font-size: 0.65rem;
                    white-space: nowrap;
                    border: 1px solid #ffffff;
                    border-radius: 3px;
                    pointer-events: none;
                    z-index: 10;
                }
            </style>
            <audio id="audio" preload="none"></audio>
            <span class="sr-only" id="status" role="status" aria-live="polite"></span>
        </main>
    </body>
</html>
