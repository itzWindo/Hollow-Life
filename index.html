                    </portc>
                    <portc>

                        <a href="character/siphoning.html">
                            <img src="siphon.jpg" width="200">
                        </a>
                        <div class="titc">Great Siphoning</div>

                    <portc>

                        </a>

                    </portc>
                </div>
                <p style="text-align: right; font-size: small; color: rgb(116, 43, 226); font-family: 'Courier New', Courier, monospace;" onclick="window.open('changelog.html', 'Changelog', 'width=628, height=256, location=no')">v1.3.0</p>
            </div>
        </div>
        <audio id="easterSound" src="623.opus"></audio>
        <script>
            const amb = new Audio('realm.opus');
            setTimeout( () => {
                amb.play()
            }
            , 64);
            amb.loop = true;
            document.addEventListener("DOMContentLoaded", () => {
                const container = document.querySelector(".frameframe");
                const elements = [...container.querySelectorAll("portc")];
                const SPEED = 2;
                const portraits = [];

                function resetPositions() {
                    portraits.forEach(p => {
                        p.el.style.transform = "";
                        p.x = 0;
                        p.y = 0;
                    });
                    const bounds = container.getBoundingClientRect();
                    portraits.forEach(p => {
                        const r = p.el.getBoundingClientRect();
                        p.homeX = r.left - bounds.left;
                        p.homeY = r.top - bounds.top;
                        p.width = r.width;
                        p.height = r.height;
                    });
                }

                elements.forEach(el => {
                    const angle = Math.random() * Math.PI * 2;
                    portraits.push({
                        el, x: 0, y: 0,
                        vx: Math.cos(angle) * SPEED,
                        vy: Math.sin(angle) * SPEED
                    });
                });
                resetPositions();

                let previous = performance.now();
                function animate(now) {
                    const dt = Math.min((now - previous) / 1000, 0.04);
                    previous = now;
                    const maxX = container.clientWidth;
                    const maxY = container.clientHeight;

                    for (const p of portraits) {
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        let left = p.homeX + p.x;
                        let top = p.homeY + p.y;

                        if (left < 0 || left + p.width > maxX) {
                            p.vx *= -1;
                            p.x = Math.max(-p.homeX, Math.min(maxX - p.width - p.homeX, p.x));
                        }
                        if (top < 0 || top + p.height > maxY) {
                            p.vy *= -1;
                            p.y = Math.max(-p.homeY, Math.min(maxY - p.height - p.homeY, p.y));
                        }
                    }

                    for (let i = 0; i < portraits.length; i++) {
                        for (let j = i + 1; j < portraits.length; j++) {
                            const a = portraits[i], b = portraits[j];
                            const ax = a.homeX + a.x + a.width / 2;
                            const ay = a.homeY + a.y + a.height / 2;
                            const bx = b.homeX + b.x + b.width / 2;
                            const by = b.homeY + b.y + b.height / 2;
                            const overlapX = (a.width + b.width) / 2 - Math.abs(bx - ax);
                            const overlapY = (a.height + b.height) / 2 - Math.abs(by - ay);
                            if (overlapX <= 0 || overlapY <= 0) continue;

                            const nx = overlapX < overlapY ? (bx >= ax ? 1 : -1) : 0;
                            const ny = overlapX < overlapY ? 0 : (by >= ay ? 1 : -1);
                            const overlap = Math.min(overlapX, overlapY);
                            a.x -= nx * overlap / 2;
                            a.y -= ny * overlap / 2;
                            b.x += nx * overlap / 2;
                            b.y += ny * overlap / 2;

                            const relativeSpeed = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                            if (relativeSpeed < 0) {
                                a.vx += relativeSpeed * nx;
                                a.vy += relativeSpeed * ny;
                                b.vx -= relativeSpeed * nx;
                                b.vy -= relativeSpeed * ny;
                            }
                        }
                    }
                    for (const p of portraits) {
                        p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
                    }
                    requestAnimationFrame(animate);
                }
                window.addEventListener("resize", resetPositions);
                requestAnimationFrame(animate);
            });

            const portrait = document.getElementById("portrait");
            const easterSound = document.getElementById("easterSound");

            // 623 seconds of inactivity
            const idleTime = 623000;

            let easterTimer = setTimeout(triggerEasterEgg, idleTime);

            function triggerEasterEgg() {
                portrait.src = "623.png";

                easterSound.play();
            }
        </script>
        <script>
            document.cookie = "tmprlLk=; path=/Hollow-Life/past; max-age=0";
        </script>
    </body>
</html>
